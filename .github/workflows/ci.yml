name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    name: PHP ${{ matrix.php }} · PostgreSQL 18
    strategy:
      fail-fast: true
      matrix:
        php: ['8.5']

    services:
      # PARIDAD EXACTA CON LA MAC (§7.1). Misma imagen, misma versión
      # mayor, MISMO PUERTO (5444) y MISMO locale ICU es-HN. Los puertos
      # se mapean a 5444/6391 a propósito: así el .env.testing commiteado
      # sirve tal cual en los dos lados y no hay un `sed` en el medio que
      # se pueda desincronizar.
      #
      # El locale NO es cosmético: con otro provider, un ORDER BY sobre
      # nombres de paciente ordena distinto en CI que en la Mac, y un
      # test de orden pasaría en un lado y fallaría en el otro.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: hospital_los_angeles_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=es-HN"
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5444:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6391:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # `redis` = extensión phpredis. REDIS_CLIENT=phpredis en el .env,
          # así que sin ella la sesión y la cache revientan solo en CI.
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, openssl, pcre, pdo, pdo_pgsql, redis, tokenizer, xml, zip
          ini-values: error_reporting=E_ALL, memory_limit=512M
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Install dependencies
        # `composer install`, NUNCA `update` (§6.4). El composer.lock
        # commiteado es la única fuente de qué versión corre.
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Security audit
        # Rompe el build ante una CVE conocida en cualquier dependencia.
        # --abandoned=report: un paquete abandonado avisa pero no bloquea.
        run: composer audit --abandoned=report

      - name: Prepare environment
        run: |
          cp .env.example .env
          cp env.testing.example .env.testing
          php artisan key:generate
          mkdir -p storage/framework/{cache/data,sessions,views,testing}
          mkdir -p storage/logs bootstrap/cache
          chmod -R 0777 storage bootstrap/cache
          php artisan storage:link

      - name: Lint (Pint)
        run: vendor/bin/pint --test -v

      - name: Static analysis (PHPStan nivel 7)
        run: vendor/bin/phpstan analyse --memory-limit=2G --error-format=github

      - name: Run migrations
        # Humo aparte de la suite: verifica que las migraciones corran
        # limpias de cero contra una base vacía, que es como se instala
        # cada sede nueva y cada clínica nueva (§1.1).
        run: php artisan migrate --force --env=testing

      - name: Run Pest test suite
        run: vendor/bin/pest --parallel --ci
